<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AMN Camera System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        html, body{
            height:100%;
        }

        body{
            background:#f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            display:flex;
            flex-direction:column;
        }

        .page-wrapper{
            flex:1;
        }

        /* NAVBAR */
        .navbar{
            background:#071322;
        }

        .navbar-brand{
            color:white;
            font-weight:bold;
        }

        .navbar-brand small{
            display:block;
            color:#cfd8dc;
            font-size:12px;
        }

        /* LOGIN BOX */
        .login-box{
            max-width:450px;
            margin:90px auto;
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .login-title{
            text-align:center;
            margin-bottom:20px;
        }

        .login-title h3{
            font-weight:bold;
            color:#071322;
        }

        .form-control{
            padding:12px;
            border-radius:12px;
        }

        .input-group-text{
            background:#071322;
            color:white;
            border:none;
            border-radius:12px 0 0 12px;
        }

        .btn-login{
            width:100%;
            padding:12px;
            border-radius:12px;
            font-weight:bold;
        }

        .register-link a{
            text-decoration:none;
            font-weight:bold;
        }

        .register-link a:hover{
            text-decoration:underline;
        }

        footer{
            background:#071322;
            color:white;
            padding:15px;
            text-align:center;
            margin-top:auto;
        }

    </style>
</head>

<body>

<div class="page-wrapper">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                AMN Camera Store
                <small>Addis Media Network</small>
            </a>

            <a href="{% url 'home' %}" class="btn btn-outline-light me-2">
                Home
            </a>
        </div>
    </nav>

    <!-- LOGIN BOX -->
    <div class="login-box">

        <div class="login-title">
            <h3>Login</h3>
            <p class="text-muted">Access your account</p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <!-- USERNAME -->
            <div class="mb-3">
                <label>Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label>Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn btn-primary btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>

            <!-- REGISTER LINK -->
            <div class="text-center mt-3 register-link">
                <small class="text-muted">
                    Don't have an account?
                    <a href="{% url 'register' %}">Register</a>
                </small>
            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<footer>
    © 2026 Camera Inventory System | Addis Media Network
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
