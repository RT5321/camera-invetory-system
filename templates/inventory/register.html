{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta  charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AMN Camera System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        html, body{
            height:100%;
        }

        body{
            background:#f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            display:flex;
            flex-direction:column;
        }

        .page-wrapper{
            flex:1;
        }

        /* NAVBAR */
        .navbar{
            background:#071322;
        }

        .navbar-brand{
            color:white;
            font-weight:bold;
        }

        .navbar-brand small{
            display:block;
            color:#cfd8dc;
            font-size:12px;
        }

        /* REGISTER BOX */
        .register-box{
            max-width:450px;
            margin:70px auto;
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .register-title{
            text-align:center;
            margin-bottom:20px;
        }

        .register-title h3{
            font-weight:bold;
            color:#071322;
        }

        .form-control{
            padding:12px;
            border-radius:12px;
        }

        .input-group-text{
            background:#071322;
            color:white;
            border:none;
            border-radius:12px 0 0 12px;
        }

        .show-pass{
            background:#071322;
            color:white;
            border:none;
            border-radius:0 12px 12px 0;
        }

        .btn-register{
            width:100%;
            padding:12px;
            border-radius:12px;
            font-weight:bold;
        }

        /* LOGIN LINK */
        .login-link a{
            text-decoration:none;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        /* FOOTER */
        footer{
            background:#071322;
            color:white;
            padding:15px;
            text-align:center;
            margin-top:auto;
        }

    </style>
</head>

<body>

<div class="page-wrapper">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                AMN Camera Store
                <small>Addis Media Network</small>
            </a>
             <a href="{% url 'home' %}" class="btn btn-outline-light me-2">
                Home
            </a>
        </div>
    </nav>

    <!-- REGISTER BOX -->
    <div class="register-box">

        <div class="register-title">
            <h3>Register</h3>
            <p class="text-muted">Create new account</p>
        </div>

        <form method="POST">
             {% csrf_token %}
            <!-- USERNAME -->
            <div class="mb-3">
                <label>Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label>Email</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label>Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>

                    <button class="show-pass" type="button" onclick="togglePassword('password','eye1')">
                        <i class="bi bi-eye" id="eye1"></i>
                    </button>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mb-3">
                <label>Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm password" required>

                    <button class="show-pass" type="button" onclick="togglePassword('password2','eye2')">
                        <i class="bi bi-eye" id="eye2"></i>
                    </button>
                </div>
            </div>

            <!-- REGISTER BUTTON -->
            <button type="submit" class="btn btn-primary btn-register">
                <i class="bi bi-person-plus"></i> Register
            </button>

            <!-- LOGIN LINK -->
            <div class="text-center mt-3 login-link">
                <small class="text-muted">
                    Already have an account?
                    <a href="{% url 'login' %}">Login</a>
                </small>
            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<footer>
    © 2026 Camera Inventory System | Addis Media Network
</footer>

<!-- JS PASSWORD TOGGLE -->
<script>
function togglePassword(fieldId, iconId){
    let input = document.getElementById(fieldId);
    let icon = document.getElementById(iconId);

    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    }else{
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
